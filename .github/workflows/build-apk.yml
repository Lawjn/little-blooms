name: Build APK

# Tự build APK qua EAS mỗi khi push lên master (sau khi type-check pass),
# hoặc chạy tay từ tab Actions (workflow_dispatch).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK (non-interactive)
        run: eas build --platform android --profile preview --non-interactive --no-wait
